name: Codes du jour

on:
  schedule:
  - cron: "0 7 * * *"   # 07:00 UTC = 8h à Paris en hiver
  workflow_dispatch:       # bouton "Run workflow" pour lancer à la main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install cryptography

      - name: Générer et chiffrer les codes
        env:
          TEAM_PASSPHRASE: ${{ secrets.TEAM_PASSPHRASE }}
        run: python scripts/generate.py

      - name: Publier codes.json
        run: |
          git config user.name "teamantix-bot"
          git config user.email "teamantix-bot@users.noreply.github.com"
          git add codes.json
          git commit -m "Codes du $(date -u +%F)" || echo "Rien à publier"
          git push
