name: Codes du jour

on:
schedule:
    - cron: "7 5-11 * * *"      # matin : toutes les heures de 6h à 12h (Paris)
    - cron: "7 13-17/2 * * *"   # après-midi : 14h, 16h, 18h
    - cron: "7 0,4,20 * * *"    # soir et nuit : 21h, 1h, 5h
  workflow_dispatch:       # bouton "Run workflow" pour lancer à la main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install cryptography

      - name: Générer et chiffrer les codes
        env:
          TEAM_PASSPHRASE: ${{ secrets.TEAM_PASSPHRASE }}
        run: python scripts/generate.py

      - name: Publier codes.json
        run: |
          git config user.name "teamantix-bot"
          git config user.email "teamantix-bot@users.noreply.github.com"
          git add codes.json
          git commit -m "Codes $(date -u +'%F %H:%M')" || echo "Rien à publier"
          git push
