<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Teamantix – codes de la team</title>
<style>
  :root { --bg:#16181d; --card:#22252d; --fg:#e8e8ea; --mut:#9aa0aa; --acc:#4caf7d; --err:#e36363; }
  body { margin:0; font-family:system-ui,sans-serif; background:var(--bg); color:var(--fg); }
  main { max-width:640px; margin:auto; padding:24px 16px; }
  h1 { font-size:1.4em; margin:0 0 4px; }
  .sub { color:var(--mut); margin:0 0 20px; }
  .game { background:var(--card); border-radius:10px; padding:14px 16px; margin-bottom:12px;
          display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .name { font-weight:700; width:90px; }
  .num { color:var(--mut); width:70px; }
  .code { font-family:monospace; font-size:1.1em; background:#111; padding:4px 10px; border-radius:6px; user-select:all; }
  input, button { font:inherit; border-radius:6px; padding:6px 10px; }
  input { background:#2d313b; color:var(--fg); border:1px solid #3a3f4b; width:60%; }
  button { cursor:pointer; background:var(--acc); border:none; color:#08130d; font-weight:600; }
  button.sec { background:#3a3f4b; color:var(--fg); font-weight:400; }
  a { color:var(--mut); }
  .err { color:var(--err); } .warn { color:#e0b050; }
  .top { display:flex; justify-content:space-between; align-items:baseline; gap:12px; flex-wrap:wrap; }
  .top a { font-size:.9em; }
  .state { flex-basis:100%; font-size:.9em; color:var(--mut); margin:-2px 0 0 56px; }
  .state.on { color:#e0b050; } .state.done { color:var(--acc); }
  #login { display:none; }

  /* Anneau de progression */
  .ring { width:44px; height:44px; flex:none; }
  .ring .track { fill:none; stroke:#2d313b; stroke-width:5; }
  .ring .bar { fill:none; stroke-width:5; stroke-linecap:round; opacity:0;
               transition:stroke-dashoffset .9s ease, stroke .9s ease, opacity .3s; }
  .ring text { fill:var(--fg); font-size:11px; font-weight:700;
               text-anchor:middle; dominant-baseline:central; }
  .ring.done .bar { filter:drop-shadow(0 0 3px var(--acc)); }
</style>
</head>
<body>
<main>
  <div class="top">
    <h1>Teamantix · codes de la team</h1>
    <a href="./">← Générer d'autres codes</a>
  </div>
  <p class="sub" id="status">Chargement…</p>

  <div id="login">
    <input id="pass" type="password" placeholder="Phrase secrète de la team">
    <button id="ok">Déverrouiller</button>
  </div>

  <div id="codes"></div>
  <p class="sub" id="foot"></p>
</main>

<script>
const URLS = {
  cemantix: "https://cemantix.certitudes.org",
  pedantix: "https://pedantix.certitudes.org",
  pedantle: "https://pedantle.certitudes.org",
  cemantle: "https://cemantle.certitudes.org",
};
const ORDER = Object.keys(URLS); // ordre d'affichage
// Bases Firebase des jeux (publiques, déjà présentes dans le code des sites)
const DB = {
  cemantix: "https://cemantix-11e28-default-rtdb.europe-west1.firebasedatabase.app",
  pedantix: "https://pedantix-32f5c-default-rtdb.europe-west1.firebasedatabase.app",
  cemantle: "https://cemantle-default-rtdb.firebaseio.com",
  pedantle: "https://pedantle-c5c98-default-rtdb.firebaseio.com",
};
const REFRESH_MS = 30000;
const $ = (id) => document.getElementById(id);
const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
const store = {
  get: (k) => { try { return localStorage.getItem(k); } catch { return null; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch {} },
  del: (k) => { try { localStorage.removeItem(k); } catch {} },
};

async function decrypt(enc, pass) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: b64(enc.salt), iterations: enc.iter, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(enc.iv) }, key, b64(enc.data));
  return JSON.parse(new TextDecoder().decode(pt));
}

// ---------- Anneau de progression ----------
const CIRC = 2 * Math.PI * 18;

function ringHTML(game) {
  return `<svg class="ring" data-game="${game}" viewBox="0 0 44 44" aria-hidden="true">
    <circle class="track" cx="22" cy="22" r="18"/>
    <circle class="bar" cx="22" cy="22" r="18" transform="rotate(-90 22 22)"
            stroke-dasharray="${CIRC}" stroke-dashoffset="${CIRC}"/>
    <text x="22" y="22">–</text></svg>`;
}

// p ∈ [0,1] ; couleur : bleu glacé → violet → rouge brûlant, vert si trouvé
function setRing(svg, p, label, solved) {
  p = Math.max(0, Math.min(1, p || 0));
  const bar = svg.querySelector(".bar");
  bar.style.strokeDashoffset = CIRC * (1 - p);
  bar.style.stroke = solved ? "var(--acc)" : `hsl(${210 + 150 * p} 80% 60%)`;
  bar.style.opacity = p > 0 ? 1 : 0;
  svg.classList.toggle("done", !!solved);
  svg.querySelector("text").textContent = label;
}

// Mêmes paliers que l'affichage de Cémantix
function mood(rank, temp) {
  if (rank >= 1000) return "🥳";
  if (rank >= 999) return "😱";
  if (rank >= 990) return "🔥";
  if (rank >= 900) return "🥵";
  if (rank >= 1) return "😎";
  return temp >= 0 ? "🥶" : "🧊";
}

// ---------- Copie ----------
async function copyCode(code, btn) {
  try {
    await navigator.clipboard.writeText(code);
    if (btn) {
      btn.textContent = "Copié";
      setTimeout(() => (btn.textContent = "Copier"), 2000);
    }
  } catch {}
}

function render(p) {
  const gen = new Date(p.generated);
  const ageH = (Date.now() - gen) / 36e5;
  $("status").innerHTML = `Codes générés le ${gen.toLocaleString("fr-FR", { dateStyle: "full", timeStyle: "short" })}` +
    (ageH > 26 ? ` <span class="warn">— pas encore mis à jour aujourd'hui</span>` : "");
  $("codes").innerHTML = "";
  const games = Object.keys(p.codes).sort((a, b) => ORDER.indexOf(a) - ORDER.indexOf(b));
  for (const game of games) {
    const c = p.codes[game];
    const el = document.createElement("div");
    el.className = "game";
    el.innerHTML = (c.code ? ringHTML(game) : `<span class="ring"></span>`) +
      `<span class="name">${game}</span><span class="num">n° ${c.num}</span>` +
      (c.code
        ? `<span class="code">${c.code}</span> <button class="sec">Copier</button>
           <a class="play" href="${URLS[game]}" target="_blank" rel="noopener">jouer ↗</a>`
        : `<span class="err">indisponible (${c.error})</span>`);
    if (c.code) {
      const st = document.createElement("span");
      st.className = "state";
      st.dataset.game = game;
      st.textContent = "…";
      el.appendChild(st);
    }
    const btn = el.querySelector("button");
    if (btn) btn.onclick = () => copyCode(c.code, btn);
    // Clic sur "jouer" : copie le code puis laisse le lien s'ouvrir normalement
    const play = el.querySelector("a.play");
    if (play) play.addEventListener("click", () => copyCode(c.code, btn));
    $("codes").appendChild(el);
  }
  CURRENT = p;
  refreshStates();
  $("foot").innerHTML = `« jouer ↗ » copie le code. Dans le jeu : ☁️ › colle le code › Join. <a href="#" id="logout">Oublier la phrase</a>`;
  $("logout").onclick = (e) => { e.preventDefault(); store.del("teamantix/pass"); location.hash = ""; location.reload(); };
}

let CURRENT = null, timer = null;

// Lit l'équipe dans la base du jeu (comme le fait le site) — aucun mot n'est affiché
async function teamState(game, c) {
  const key = encodeURIComponent(c.code.replace(/Ô/g, "-"));
  const r = await fetch(`${DB[game]}/g/${c.num}/${key}.json`, { cache: "no-store" });
  if (!r.ok) throw new Error("HTTP " + r.status);
  const data = await r.json();
  if (!data) return { gone: true };
  const online = Math.max(0, (data._users || 0) - 1); // le bot compte pour 1 à la création
  delete data._users;
  const guesses = Object.values(data);
  const s = { words: guesses.length, online, solved: false, p: 0, label: "–", detail: "" };

  if (game === "cemantix" || game === "cemantle") {
    // score = [température, rang] ; rang 1..1000 (top 1000), 1000 = mot secret
    let best = 0, temp = -Infinity;
    for (const v of guesses) {
      if (!Array.isArray(v)) continue;
      if (typeof v[1] === "number") best = Math.max(best, v[1]);
      if (typeof v[0] === "number") temp = Math.max(temp, v[0]);
    }
    s.solved = best >= 1000;
    s.p = best / 1000;
    s.label = s.solved ? "🥳" : best ? String(best) : "–";
    if (guesses.length) {
      const t = Math.abs(temp) <= 1 ? temp * 100 : temp; // selon le stockage (0.34 ou 34)
      s.detail = `meilleur ${mood(best, temp)} ` +
        (best ? `${best} ‰` : isFinite(t) ? `${t.toFixed(2).replace(".", ",")} °C` : "");
    }
  } else {
    // score = {position: mot révélé | proximité} ; positions 0..n-1 = mots du titre
    const found = new Set();
    for (const v of guesses)
      if (v && typeof v === "object")
        for (const [pos, x] of Object.entries(v)) if (typeof x === "string") found.add(+pos);
    const n = c.titleWords || 0;
    const revealed = [...found].filter((i) => i >= n).length;
    if (n) {
      const k = [...Array(n).keys()].filter((i) => found.has(i)).length;
      s.solved = k === n;
      s.p = k / n;
      s.label = s.solved ? "🥳" : `${k}/${n}`;
      s.detail = `titre ${k}/${n}`;
    } else {
      s.label = "?";
    }
    if (revealed) s.detail += `${s.detail ? " · " : ""}${revealed} mot${revealed > 1 ? "s" : ""} révélé${revealed > 1 ? "s" : ""}`;
  }
  return s;
}

async function refreshStates() {
  if (!CURRENT) return;
  await Promise.all(Object.entries(CURRENT.codes).map(async ([game, c]) => {
    const el = document.querySelector(`.state[data-game="${game}"]`);
    const ring = document.querySelector(`svg.ring[data-game="${game}"]`);
    if (!el) return;
    try {
      const s = await teamState(game, c);
      const who = s.online ? ` · ${s.online} en ligne` : "";
      const nb = `${s.words} mot${s.words > 1 ? "s" : ""}`;
      el.className = "state";
      if (s.gone) {
        el.textContent = "équipe fermée";
        if (ring) setRing(ring, 0, "×", false);
        return;
      }
      if (ring) setRing(ring, s.p, s.label, s.solved);
      if (s.solved) { el.className += " done"; el.textContent = `✅ trouvé en ${nb}${who}`; }
      else if (s.words) { el.className += " on"; el.textContent = `🟠 en cours · ${nb}${s.detail ? " · " + s.detail : ""}${who}`; }
      else el.textContent = `⚪ pas commencé${who}`;
    } catch (e) {
      el.textContent = "état indisponible";
    }
  }));
  clearTimeout(timer);
  timer = setTimeout(refreshStates, REFRESH_MS);
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) refreshStates(); });

async function main() {
  let enc;
  try {
    enc = await (await fetch("codes.json?t=" + Date.now(), { cache: "no-store" })).json();
  } catch {
    $("status").innerHTML = `<span class="err">Aucun code publié pour l'instant.</span>`;
    return;
  }
  const fromHash = (location.hash.match(/k=([^&]+)/) || [])[1];
  if (fromHash) {
    store.set("teamantix/pass", decodeURIComponent(fromHash));
    history.replaceState(null, "", location.pathname); // retire la phrase de la barre d'adresse
  }

  async function tryPass(pass) {
    try {
      render(await decrypt(enc, pass));
      store.set("teamantix/pass", pass);
      $("login").style.display = "none";
      return true;
    } catch {
      return false;
    }
  }

  const saved = store.get("teamantix/pass");
  if (saved && await tryPass(saved)) return;

  $("status").textContent = saved ? "Phrase secrète incorrecte." : "Entre la phrase secrète de la team.";
  $("login").style.display = "block";
  const submit = async () => {
    if (!(await tryPass($("pass").value))) $("status").textContent = "Phrase secrète incorrecte.";
  };
  $("ok").onclick = submit;
  $("pass").onkeydown = (e) => { if (e.key === "Enter") submit(); };
}
main();
</script>
</body>
</html>
